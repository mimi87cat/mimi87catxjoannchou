<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合作總覽 - Realtime Database 版</title>
<!-- 載入 SheetJS 套件用於 Excel 匯入/匯出 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+TC:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --bg: #232025;
    --bg-panel: #2C2830;
    --line: #3D3742;
    --text: #EFE9E4;
    --text-soft: #A69DAB;
    --accent: #FF6F91;
    --accent-dark: #C94A6C;
    --mint: #7FE0B4;
    --sky: #8FC5F5;
    --butter: #FFD873;
    --pink: #FFB3C6;
    --danger: #E85D5D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', 'Noto Sans TC', sans-serif;
    padding: 28px 16px 64px;
  }
  .wrap{ max-width: 1100px; margin:0 auto; }

  .header{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:22px; flex-wrap:wrap; gap:12px;
  }
  .header h1{
    font-family:'Space Grotesk', 'Noto Sans TC', sans-serif;
    font-weight:700; font-size:30px; margin:0 0 4px;
    letter-spacing: -0.3px;
  }
  .header p{ margin:0; color: var(--text-soft); font-size:13px; }

  .user-bar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .user-avatar{
    width:30px; height:30px; border-radius:50%; object-fit:cover;
    border:1px solid var(--line);
  }
  .user-name{ font-size:12.5px; color: var(--text-soft); }
  .btn-logout, .btn-account{
    background:transparent; border:1px solid var(--line); color: var(--text-soft);
    border-radius:7px; padding:7px 12px; font-size:12.5px; cursor:pointer; font-family:'Inter';
  }
  .btn-logout:hover, .btn-account:hover{ border-color: var(--accent); color: var(--text); }

  .stats{ display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
  .stat{
    flex:1; min-width:140px; background: var(--bg-panel); border:1px solid var(--line);
    border-radius:12px; padding:14px 16px;
  }
  .stat .l{ font-size:12px; color: var(--text-soft); margin-bottom:6px; }
  .stat .n{ font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:700; }
  .stat.paid .n{ color: var(--mint); }
  .stat.pending .n{ color: var(--butter); }

  .add-card{
    background: var(--bg-panel); border:1px solid var(--line); border-radius:12px;
    padding:16px; margin-bottom:24px;
  }
  .add-title{ font-size:13px; color:var(--text-soft); margin:0 0 10px; font-weight:500; }
  .add-grid{
    display:grid; grid-template-columns: 1.6fr 1.4fr 1fr; gap:8px;
  }
  .add-grid input, .add-grid select{
    width:100%; padding:9px 10px; border-radius:7px; border:1px solid var(--line);
    background: var(--bg); color: var(--text); font-size:13px; font-family:'Inter';
  }
  .add-grid input::placeholder{ color: var(--text-soft); }
  .plat-toggles{
    grid-column: 1 / -1;
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .plat-chip, .type-chip, .mode-chip, .auth-chip{
    padding:7px 13px; border-radius:999px; border:1px solid var(--line);
    background: var(--bg); color: var(--text-soft); font-size:12.5px; cursor:pointer;
    font-family:'Inter'; user-select:none;
  }
  .plat-chip.selected{ background: var(--accent); color:#3A1420; border-color: var(--accent); font-weight:600; }
  .type-chip.selected{ background: var(--mint); color:#0F3B29; border-color: var(--mint); font-weight:600; }
  .mode-chip.selected{ background: var(--sky); color:#0B2E4D; border-color: var(--sky); font-weight:600; }
  .auth-chip.selected{ background: var(--pink); color:#4A0F26; border-color: var(--pink); font-weight:600; }

  .field-label{ grid-column: 1 / -1; font-size:11.5px; color: var(--text-soft); margin: 2px 0 -4px; }
  .date-fields{ grid-column: 1 / -1; display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:8px; }
  .date-field label{ display:block; font-size:11px; color: var(--text-soft); margin-bottom:3px; }
  .date-field input{ width:100%; }
  .noncompete-row{ grid-column: 1 / -1; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .checkbox-field{ display:flex; align-items:center; gap:7px; font-size:13px; color: var(--text); cursor:pointer; user-select:none; }
  .checkbox-field input{ width:16px; height:16px; accent-color: var(--accent); cursor:pointer; }
  .noncompete-date{ display:none; align-items:center; gap:7px; font-size:12px; color: var(--text-soft); }
  .noncompete-date.show{ display:flex; }
  .noncompete-date input{
    padding:7px 9px; border-radius:6px; border:1px solid var(--line);
    background: var(--bg); color: var(--text); font-size:13px; font-family:'Inter';
  }
  .btn-add{
    grid-column: 1 / -1; margin-top:4px; background: var(--accent); color:#3A1420;
    border:none; border-radius:7px; padding:10px; font-weight:600; font-size:14px;
    cursor:pointer; font-family:'Inter';
  }
  .btn-add:hover{ background: var(--accent-dark); color:#fff; }
  .err{ grid-column:1/-1; color: var(--danger); font-size:12px; display:none; }

  .filters{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .tab{
    padding:6px 13px; border-radius:999px; border:1px solid var(--line); background:transparent;
    color: var(--text-soft); font-size:12px; cursor:pointer; font-family:'IBM Plex Mono', monospace;
  }
  .tab.active{ background: var(--text); color: var(--bg); border-color: var(--text); font-weight:500; }

  .board{ display:flex; gap:16px; overflow-x:auto; padding-bottom:12px; }
  .col{ flex: 0 0 230px; min-width:230px; }
  .col-head{ display:flex; align-items:center; gap:8px; margin-bottom:12px; padding: 0 4px; }
  .col-dot{ width:8px; height:8px; border-radius:50%; }
  .col-head h3{ font-size:13px; margin:0; font-weight:600; }
  .col-count{ margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-soft); }

  .note{
    position:relative; border-radius:4px; padding:14px 12px 12px; margin-bottom:16px;
    color:#2B2620; box-shadow: 0 3px 8px rgba(0,0,0,0.25); font-size:13px; cursor: pointer;
  }
  .note::before{
    content:''; position:absolute; top:-9px; left:18px; width:46px; height:16px;
    background: rgba(255,255,255,0.55); border: 1px solid rgba(0,0,0,0.06); transform: rotate(-4deg);
  }
  .note.n0{ background: var(--butter); transform: rotate(-1.4deg); }
  .note.n1{ background: var(--mint); transform: rotate(1.1deg); }
  .note.n2{ background: var(--pink); transform: rotate(-0.8deg); }
  .note.n3{ background: var(--sky); transform: rotate(1.6deg); }
  .note-brand{ font-weight:700; font-size:14.5px; margin:0 0 4px; font-family:'Space Grotesk', sans-serif; }
  .note-no{ font-family:'IBM Plex Mono', monospace; font-size:10px; opacity:0.55; margin:0 0 3px; letter-spacing:0.5px; }
  .note-product{ font-size:12px; font-weight:500; opacity:0.85; margin:0 0 4px; }
  .note-type{ font-size:11.5px; opacity:0.75; margin:0 0 8px; }
  .note-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:12px; }
  .note-fee{ font-family:'IBM Plex Mono', monospace; font-weight:600; }
  .note-due{ font-family:'IBM Plex Mono', monospace; opacity:0.75; }
  .note-due.overdue{ color: #B23A2E; font-weight:600; }
  .note-dates{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; opacity:0.7; margin-bottom:8px; line-height:1.6; }

  .sales-input-wrap{
    background: rgba(255,255,255,0.4); border-radius: 6px; padding: 6px 8px; margin: 8px 0;
  }
  .sales-input-wrap label{ font-size:11px; display:block; margin-bottom:3px; opacity:0.8; font-weight:600; }
  .sales-input-wrap input{
    width: 100%; border: 1px solid rgba(0,0,0,0.2); border-radius: 4px; padding: 4px 6px;
    font-size: 12px; font-family: 'IBM Plex Mono', monospace; background: rgba(255,255,255,0.8);
  }

  .note-actions{ display:flex; gap:6px; margin-top:8px; }
  .note-actions select{
    flex:1; font-size:11.5px; padding:5px 6px; border-radius:5px; border:1px solid rgba(0,0,0,0.15);
    background: rgba(255,255,255,0.6); font-family:'Inter';
  }
  .note-del{ background:none; border:none; cursor:pointer; opacity:0.55; font-size:13px; padding:4px 6px; }
  .note-del:hover{ opacity:1; }

  .empty-col{ border: 1px dashed var(--line); border-radius:8px; padding:20px 10px; text-align:center; color: var(--text-soft); font-size:12px; }

  .col-more-btn{
    width:100%; background:transparent; border:1px dashed var(--line); color: var(--text-soft);
    border-radius:8px; padding:9px; font-size:12px; cursor:pointer; font-family:'Inter'; margin-top:2px;
  }
  .col-more-btn:hover{ border-color: var(--accent); color: var(--text); }

  .deadline-banner{
    background: rgba(255,216,115,0.12); border:1px solid rgba(255,216,115,0.4);
    border-radius:12px; padding:14px 16px; margin-bottom:20px; display:none;
  }
  .deadline-banner.show{ display:block; }
  .deadline-banner h3{
    margin:0 0 8px; font-size:13px; color: var(--butter); display:flex; align-items:center; gap:6px;
  }
  .deadline-list{ display:flex; flex-direction:column; gap:6px; }
  .deadline-item{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; background: rgba(255,255,255,0.04); border-radius:7px; padding:7px 10px;
  }
  .deadline-item .name{ color: var(--text); }
  .deadline-item .days{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600;
  }
  .deadline-item .days.today{ color: var(--danger); }
  .note-deadline-badge{
    display:inline-block; font-size:10.5px; font-family:'IBM Plex Mono', monospace;
    font-weight:600; padding:2px 7px; border-radius:999px; margin-bottom:6px;
    background: rgba(255,216,115,0.35); color:#5A3D00;
  }
  .note-deadline-badge.today{ background: rgba(232,93,93,0.35); color:#5A0F0F; }

  /* login overlay */
  .login-overlay{
    position:fixed; inset:0; background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .login-card{
    background: var(--bg-panel); border:1px solid var(--line); border-radius:16px;
    padding:36px 32px; text-align:center; max-width:340px; width:100%;
  }
  .login-card h1{
    font-family:'Space Grotesk', 'Noto Sans TC', sans-serif; font-size:26px; margin:0 0 6px;
  }
  .login-card p{ color: var(--text-soft); font-size:13px; margin:0 0 26px; }
  .login-form{ display:flex; flex-direction:column; gap:10px; text-align:left; }
  .login-form label{ font-size:11.5px; color: var(--text-soft); margin-bottom:3px; display:block; }
  .login-form input{
    width:100%; padding:10px 11px; border-radius:7px; border:1px solid var(--line);
    background: var(--bg); color: var(--text); font-size:14px; font-family:'Inter';
  }
  .btn-auth-primary{
    background: var(--accent); color:#3A1420; border:none; border-radius:7px;
    padding:11px; font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter';
    margin-top:4px;
  }
  .btn-auth-primary:hover{ background: var(--accent-dark); color:#fff; }
  .auth-toggle-row{ text-align:center; margin-top:16px; font-size:12.5px; color: var(--text-soft); }
  .auth-toggle-link{
    background:none; border:none; color: var(--accent); cursor:pointer; font-size:12.5px;
    font-family:'Inter'; text-decoration:underline; padding:0;
  }
  .login-err{ color: var(--danger); font-size:12.5px; margin-top:14px; display:none; }
  .login-ok{ color: var(--mint); font-size:12.5px; margin-top:14px; display:none; }
  .login-loading{ color: var(--text-soft); font-size:12.5px; margin-top:14px; display:none; }
  .app-hidden{ display:none !important; }
  .forgot-row{ text-align:center; margin-top:10px; }
  .forgot-row button{
    background:none; border:none; color: var(--text-soft); cursor:pointer; font-size:12px;
    font-family:'Inter'; text-decoration:underline; padding:0;
  }

  .modal-overlay{
    position:fixed; inset:0; background: rgba(0,0,0,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:200; padding:20px;
  }
  .modal-card{
    background: var(--bg-panel); border:1px solid var(--line); border-radius:16px;
    padding:28px; max-width:400px; width:100%; max-height:88vh; overflow-y:auto; position:relative;
  }
  .modal-card h2{
    font-family:'Space Grotesk', 'Noto Sans TC', sans-serif; font-size:20px; margin:0 0 18px;
  }
  .modal-section{ margin-bottom:22px; }
  .modal-section h3{ font-size:13px; margin:0 0 10px; color: var(--text-soft); font-weight:600; }
  .modal-section .login-form{ gap:8px; }
  .modal-section .login-err, .modal-section .login-ok{ margin-top:8px; }
  .modal-close{
    position:absolute; top:16px; right:18px; background:none; border:none;
    color: var(--text-soft); font-size:18px; cursor:pointer;
  }
  .danger-zone{
    border:1px solid rgba(232,93,93,0.4); border-radius:10px; padding:14px;
    background: rgba(232,93,93,0.06);
  }
  .danger-zone h3{ color: var(--danger); }
  .danger-zone p{ font-size:12px; color: var(--text-soft); margin:0 0 10px; }
  .btn-danger{
    background: var(--danger); color:#fff; border:none; border-radius:7px;
    padding:10px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:'Inter';
    width:100%; margin-top:4px;
  }
  .btn-danger:hover{ background:#C94848; }

  @media (max-width:640px){
    .add-grid{ grid-template-columns: 1fr 1fr; }
    .stat{ min-width: 100%; }
  }
</style>
</head>
<body>

<!-- 登入畫面 -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h1>合作總覽</h1>
    <p id="loginSubtitle">請先登入才能使用您的案件資料</p>
    <div class="login-form">
      <div>
        <label for="inputAuthEmail">Email</label>
        <input type="email" id="inputAuthEmail" placeholder="you@example.com" autocomplete="email">
      </div>
      <div id="passwordFieldWrap">
        <label for="inputAuthPassword">密碼</label>
        <input type="password" id="inputAuthPassword" placeholder="至少 6 個字元" autocomplete="current-password">
      </div>
      <button class="btn-auth-primary" id="btnAuthSubmit">登入</button>
    </div>
    <div class="auth-toggle-row">
      <span id="authToggleHint">還沒有帳號？</span><button class="auth-toggle-link" id="btnAuthToggle">註冊新帳號</button>
    </div>
    <div class="forgot-row" id="forgotRow">
      <button id="btnForgotPassword">忘記密碼？</button>
    </div>
    <p class="login-err" id="loginErr">登入失敗，請再試一次</p>
    <p class="login-ok" id="loginOk"></p>
    <p class="login-loading" id="loginLoading">處理中…</p>
  </div>
</div>

<div class="wrap app-hidden" id="appRoot">

  <div class="header">
    <div>
      <h1>合作總覽</h1>
      <p>進度追蹤 (Realtime Database)</p>
    </div>
    <div class="user-bar">
      <span class="user-name" id="userName"></span>
      <button class="btn-account" id="btnExportExcel">匯出 Excel</button>
      <button class="btn-account" id="btnImportExcel">匯入 Excel</button>
      <input type="file" id="fileImportExcel" accept=".xlsx, .xls, .csv" style="display:none;" />
      <button class="btn-account" id="btnAccountSettings">帳號設定</button>
      <button class="btn-logout" id="btnLogout">登出</button>
    </div>
  </div>

  <div class="deadline-banner" id="deadlineBanner">
    <h3>⏰ 即將到期的初稿</h3>
    <div class="deadline-list" id="deadlineList"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="l">進行中案件</div>
      <div class="n" id="statActive">0</div>
    </div>
    <div class="stat pending">
      <div class="l">待請款金額</div>
      <div class="n" id="statPending">NT$0</div>
    </div>
    <div class="stat paid">
      <div class="l">已收款總額</div>
      <div class="n" id="statPaid">NT$0</div>
    </div>
  </div>

  <div class="add-card">
    <p class="add-title" id="addTitle">新增案件</p>
    <div class="add-grid">
      <input type="text" id="inputBrand" placeholder="品牌／案主名稱" maxlength="40">
      <input type="text" id="inputProduct" placeholder="產品名稱" maxlength="40">
      <input type="number" id="inputFee" placeholder="保底/固定金額 NT$" min="0">
      <div class="field-label">重要日期</div>
      <div class="date-fields">
        <div class="date-field">
          <label for="inputDateContract">簽約日期</label>
          <input type="date" id="inputDateContract">
        </div>
        <div class="date-field">
          <label for="inputDateDraft">初稿繳交截止日</label>
          <input type="date" id="inputDateDraft">
        </div>
        <div class="date-field" id="singleCollabDateWrap">
          <label for="inputDateCollab">合作日期</label>
          <input type="date" id="inputDateCollab">
        </div>
        <div class="date-field" id="rangeCollabStartWrap" style="display:none;">
          <label for="inputDateCollabStart">合作開始日期</label>
          <input type="date" id="inputDateCollabStart">
        </div>
        <div class="date-field" id="rangeCollabEndWrap" style="display:none;">
          <label for="inputDateCollabEnd">合作結束日期</label>
          <input type="date" id="inputDateCollabEnd">
        </div>
      </div>
      <div class="noncompete-row">
        <label class="checkbox-field">
          <input type="checkbox" id="inputHasNonCompete">
          有競業條款
        </label>
        <div class="noncompete-date" id="nonCompeteDateWrap">
          <label for="inputNonCompeteDate">競業截止日</label>
          <input type="date" id="inputNonCompeteDate">
        </div>
      </div>
      <div class="field-label">授權</div>
      <div class="noncompete-row">
        <div class="plat-toggles" id="authToggles" style="margin-right:6px;">
          <button type="button" class="auth-chip" data-auth="廣告">廣告授權</button>
          <button type="button" class="auth-chip" data-auth="素材">素材授權</button>
        </div>
        <div class="noncompete-date" id="authDateWrap">
          <label for="inputAuthDate">授權截止日</label>
          <input type="date" id="inputAuthDate">
        </div>
      </div>
      <div class="field-label">合作項目</div>
      <div class="plat-toggles" id="typeToggles">
        <button type="button" class="type-chip" data-type="保健品">保健品</button>
        <button type="button" class="type-chip" data-type="貓砂">貓砂</button>
        <button type="button" class="type-chip" data-type="飼料">飼料</button>
        <button type="button" class="type-chip" data-type="罐頭">罐頭</button>
        <button type="button" class="type-chip" data-type="電器">電器</button>
        <button type="button" class="type-chip" data-type="零食">零食</button>
        <button type="button" class="type-chip" data-type="其他">其他</button>
      </div>
      <div class="field-label">合作模式</div>
      <div class="plat-toggles" id="modeToggles">
        <button type="button" class="mode-chip" data-mode="圖文">圖文</button>
        <button type="button" class="mode-chip" data-mode="限時動態">限時動態</button>
        <button type="button" class="mode-chip" data-mode="短影片">短影片</button>
        <button type="button" class="mode-chip" data-mode="團購">團購</button>
        <button type="button" class="mode-chip" data-mode="串文">串文</button>
        <button type="button" class="mode-chip" data-mode="分潤">分潤</button>
      </div>
      <div class="noncompete-date" id="commissionRateWrap">
        <label for="inputCommissionRate">分潤／團購</label>
        <input type="number" id="inputCommissionRate" min="0" max="100" step="0.1" style="width:70px;">
        <span>％</span>
      </div>
      <div class="field-label">合作平台</div>
      <div class="plat-toggles" id="platToggles">
        <button type="button" class="plat-chip" data-plat="IG">Instagram</button>
        <button type="button" class="plat-chip" data-plat="Facebook">Facebook</button>
        <button type="button" class="plat-chip" data-plat="YouTube">YouTube</button>
        <button type="button" class="plat-chip" data-plat="TikTok">TikTok</button>
        <button type="button" class="plat-chip" data-plat="Threads">Threads</button>
        <button type="button" class="plat-chip" data-plat="其他">其他平台</button>
      </div>
      <button class="btn-add" id="btnAdd">加入合作總覽</button>

<div class="modal-overlay app-hidden" id="accountModal">

<!-- 載入 Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import {
    getDatabase, ref, set, get, onValue, off, remove, update
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged,
    sendPasswordResetEmail, updatePassword, deleteUser, reauthenticateWithCredential, EmailAuthProvider
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBueHixQMEej2CH8Q_iJp6E9CFWIQ8Iovw",
    authDomain: "joann-b7ae9.firebaseapp.com",
    databaseURL: "https://joann-b7ae9-default-rtdb.firebaseio.com",
    projectId: "joann-b7ae9",
    storageBucket: "joann-b7ae9.firebasestorage.app",
    messagingSenderId: "616676418288",
    appId: "1:616676418288:web:b96fc2cc9b56d835f55835",
    measurementId: "G-ZLT3ZE4LNL"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  let cases = [];
  let currentPlat = 'all';
  let currentYear = 'all';
  let selectedPlatforms = [];
  let selectedTypes = [];
  let selectedModes = [];
  let editingId = null;
  let currentUser = null;
  let casesRef = null;
  let expandedStages = new Set();

  function getSortDate(c){
    const d = c.dates || {};
    return d.draft || d.collabStart || d.collab || d.contract || null;
  }

  const STAGES = [
    { key:'製作中', dot: 'var(--butter)' },
    { key:'待審核', dot: 'var(--pink)' },
    { key:'待請款', dot: 'var(--danger)' },
    { key:'已收款', dot: 'var(--mint)' }
  ];

  // ---------- 登入系統 ----------

  function showLogin(){
    document.getElementById('loginOverlay').classList.remove('app-hidden');
    document.getElementById('appRoot').classList.add('app-hidden');
    document.getElementById('inputAuthEmail').value = '';
    document.getElementById('inputAuthPassword').value = '';
    document.getElementById('loginErr').style.display = 'none';
    document.getElementById('loginOk').style.display = 'none';
    setResetMode(false);
  }

  function showApp(user){
    document.getElementById('loginOverlay').classList.add('app-hidden');
    document.getElementById('appRoot').classList.remove('app-hidden');
    document.getElementById('userName').textContent = user.email || '';
  }

  let isRegisterMode = false;
  let isResetMode = false;

  function authErrorMessage(e){
    const code = e && e.code;
    switch(code){
      case 'auth/invalid-email': return 'Email 格式不正確';
      case 'auth/missing-password': return '請輸入密碼';
      case 'auth/weak-password': return '密碼至少需要 6 個字元';
      case 'auth/email-already-in-use': return '這個 Email 已經註冊過了，請直接登入';
      case 'auth/user-not-found': return '找不到這個帳號，請確認 Email 或先註冊';
      case 'auth/wrong-password': return '密碼錯誤';
      case 'auth/invalid-credential': return 'Email 或密碼不正確';
      case 'auth/too-many-requests': return '嘗試次數過多，請稍後再試';
      case 'auth/requires-recent-login': return '這個操作需要重新登入驗證身分，請重新輸入密碼';
      default: return isResetMode ? '寄送失敗，請再試一次' : (isRegisterMode ? '註冊失敗，請再試一次' : '登入失敗，請再試一次');
    }
  }

  function setAuthMode(registerMode){
    isRegisterMode = registerMode;
    document.getElementById('loginSubtitle').textContent = registerMode
      ? '建立新帳號來管理你的案件資料'
      : '請先登入才能使用您的案件資料';
    document.getElementById('btnAuthSubmit').textContent = registerMode ? '註冊' : '登入';
    document.getElementById('btnAuthToggle').textContent = registerMode ? '已有帳號？改為登入' : '註冊新帳號';
    document.getElementById('authToggleHint').textContent = registerMode ? '' : '還沒有帳號？';
    document.getElementById('loginErr').style.display = 'none';
    document.getElementById('loginOk').style.display = 'none';
  }

  function setResetMode(resetMode){
    isResetMode = resetMode;
    document.getElementById('passwordFieldWrap').style.display = resetMode ? 'none' : 'block';
    document.getElementById('btnAuthSubmit').textContent = resetMode ? '寄送重設密碼信' : (isRegisterMode ? '註冊' : '登入');
    document.querySelector('.auth-toggle-row').style.display = resetMode ? 'none' : 'block';
    document.getElementById('btnForgotPassword').textContent = resetMode ? '返回登入' : '忘記密碼？';
    document.getElementById('loginSubtitle').textContent = resetMode
      ? '輸入註冊時使用的 Email，我們會寄送重設密碼連結給你'
      : (isRegisterMode ? '建立新帳號來管理你的案件資料' : '請先登入才能使用您的案件資料');
    document.getElementById('loginErr').style.display = 'none';
    document.getElementById('loginOk').style.display = 'none';
  }

  document.getElementById('btnForgotPassword').addEventListener('click', () => {
    setResetMode(!isResetMode);
  });

  document.getElementById('inputAuthPassword').addEventListener('keydown', e => {
    if(e.key === 'Enter') document.getElementById('btnAuthSubmit').click();
  });

  document.getElementById('btnAuthToggle').addEventListener('click', () => {
    if(isResetMode) setResetMode(false);
    setAuthMode(!isRegisterMode);
  });

  document.getElementById('btnAuthSubmit').addEventListener('click', async () => {
    const email = document.getElementById('inputAuthEmail').value.trim();
    const password = document.getElementById('inputAuthPassword').value;
    const errEl = document.getElementById('loginErr');
    const okEl = document.getElementById('loginOk');
    const loadingEl = document.getElementById('loginLoading');

    if(!email || (!isResetMode && !password)){
      errEl.textContent = isResetMode ? '請輸入 Email' : '請輸入 Email 和密碼';
      errEl.style.display = 'block';
      okEl.style.display = 'none';
      return;
    }

    errEl.style.display = 'none';
    okEl.style.display = 'none';
    loadingEl.style.display = 'block';
    try{
      if(isResetMode){
        await sendPasswordResetEmail(auth, email);
        okEl.textContent = '重設密碼信已寄出，請至信箱查收（含垃圾郵件匣）';
        okEl.style.display = 'block';
      }else if(isRegisterMode){
        await createUserWithEmailAndPassword(auth, email, password);
      }else{
        await signInWithEmailAndPassword(auth, email, password);
      }
    }catch(e){
      console.error('登入/註冊/重設密碼失敗', e);
      errEl.textContent = authErrorMessage(e);
      errEl.style.display = 'block';
    }finally{
      loadingEl.style.display = 'none';
    }
  });

  document.getElementById('btnLogout').addEventListener('click', async () => {
    await signOut(auth);
  });

  // ---------- 帳號設定：修改密碼／刪除帳號 ----------

  function openAccountModal(){
    document.getElementById('inputCurrentPassword').value = '';
    document.getElementById('inputNewPassword').value = '';
    document.getElementById('inputDeleteAccountPassword').value = '';
    document.getElementById('changePwErr').style.display = 'none';
    document.getElementById('changePwOk').style.display = 'none';
    document.getElementById('deleteAccErr').style.display = 'none';
    document.getElementById('accountModal').classList.remove('app-hidden');
  }

  function closeAccountModal(){
    document.getElementById('accountModal').classList.add('app-hidden');
  }

  document.getElementById('btnAccountSettings').addEventListener('click', openAccountModal);
  document.getElementById('btnCloseAccountModal').addEventListener('click', closeAccountModal);
  document.getElementById('accountModal').addEventListener('click', e => {
    if(e.target.id === 'accountModal') closeAccountModal();
  });

  async function reauth(currentPassword){
    const credential = EmailAuthProvider.credential(currentUser.email, currentPassword);
    await reauthenticateWithCredential(currentUser, credential);
  }

  document.getElementById('btnChangePassword').addEventListener('click', async () => {
    const currentPassword = document.getElementById('inputCurrentPassword').value;
    const newPassword = document.getElementById('inputNewPassword').value;
    const errEl = document.getElementById('changePwErr');
    const okEl = document.getElementById('changePwOk');
    errEl.style.display = 'none';
    okEl.style.display = 'none';

    if(!currentPassword || !newPassword){
      errEl.textContent = '請輸入目前密碼和新密碼';
      errEl.style.display = 'block';
      return;
    }
    if(newPassword.length < 6){
      errEl.textContent = '新密碼至少需要 6 個字元';
      errEl.style.display = 'block';
      return;
    }

    try{
      await reauth(currentPassword);
      await updatePassword(currentUser, newPassword);
      okEl.textContent = '密碼已更新';
      okEl.style.display = 'block';
      document.getElementById('inputCurrentPassword').value = '';
      document.getElementById('inputNewPassword').value = '';
    }catch(e){
      console.error('修改密碼失敗', e);
      errEl.textContent = authErrorMessage(e);
      errEl.style.display = 'block';
    }
  });

  document.getElementById('btnDeleteAccount').addEventListener('click', async () => {
    const password = document.getElementById('inputDeleteAccountPassword').value;
    const errEl = document.getElementById('deleteAccErr');
    errEl.style.display = 'none';

    if(!password){
      errEl.textContent = '請輸入密碼以確認';
      errEl.style.display = 'block';
      return;
    }

    const confirmed = window.confirm('確定要永久刪除帳號和所有案件資料嗎？這個動作無法復原。');
    if(!confirmed) return;

    try{
      await reauth(password);
      const uidToDelete = currentUser.uid;
      await remove(ref(db, `users/${uidToDelete}`));
      await deleteUser(currentUser);
      closeAccountModal();
    }catch(e){
      console.error('刪除帳號失敗', e);
      errEl.textContent = authErrorMessage(e);
      errEl.style.display = 'block';
    }
  });

  onAuthStateChanged(auth, (user) => {
    if(casesRef){
      off(casesRef);
      casesRef = null;
    }
    if(user){
      currentUser = user;
      showApp(user);
      cases = [];
      resetForm();
      initRealtimeSync(user.uid);
    }else{
      currentUser = null;
      cases = [];
      closeAccountModal();
      showLogin();
    }
  });

  // ---------- 資料同步（依使用者 UID 區隔） ----------

  /*
   * 自動移動規則：
   * 當案件目前為「待審核」，且今天已經到達「合作日期」，
   * 就自動把階段更新為「待請款」。
   *
   * 單一合作日期：dates.collab
   * 合作區間（團購／分潤）：使用 dates.collabEnd（合作結束日期）
   *
   * 這裡會直接寫回 Firebase，因此重新整理頁面後狀態也會保留。
   */
  async function autoMoveApprovedCasesToPending() {
    if (!currentUser || !cases || cases.length === 0) return;

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const updates = {};

    cases.forEach(c => {
      if (c.stage !== '待審核') return;

      const d = c.dates || {};

      // 一般案件使用合作日期；團購／分潤等區間案件使用合作結束日期
      const isComm = c.modes && (c.modes.includes('團購') || c.modes.includes('分潤'));
      const collabDate = isComm
        ? (d.collabEnd || d.collab)
        : d.collab;
      if (!collabDate) return;

      // 避免時區造成 YYYY-MM-DD 被誤判成前一天
      const collabDay = new Date(collabDate + 'T00:00:00');
      if (isNaN(collabDay.getTime())) return;

      collabDay.setHours(0, 0, 0, 0);

      // 「已到合作日期」包含合作日期當天
      if (today >= collabDay) {
        updates[`users/${currentUser.uid}/cases/${c.id}/stage`] = '待請款';
      }
    });

    if (Object.keys(updates).length === 0) return;

    try {
      await update(ref(db), updates);
      console.log(
        '已自動將合作日期到期的待審核案件移至待請款：',
        Object.keys(updates).length,
        '筆'
      );
    } catch (e) {
      console.error('自動移動案件階段失敗：', e);
    }
  }

  function initRealtimeSync(uid) {
    casesRef = ref(db, `users/${uid}/cases`);
    onValue(casesRef, async (snapshot) => {
      const data = snapshot.val();

      if (data) {
        cases = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      } else {
        cases = [];
      }

      /*
       * 先檢查是否有「待審核」案件已經到合作日期。
       * update() 寫回 Firebase 後，onValue 會再次觸發，
       * 但已移到「待請款」的案件不會再次符合條件。
       */
      await autoMoveApprovedCasesToPending();

      renderYearFilters();
      render();
    });
  }

  function uid(){ return 'c' + Date.now() + Math.random().toString(36).slice(2,7); }

  function getTargetYear(dates) {
    const d = dates || {};
    const collabDate = d.collab || d.collabStart;
    if (collabDate) return new Date(collabDate).getFullYear();
    if (d.draft) return new Date(d.draft).getFullYear();
    if (d.contract) return new Date(d.contract).getFullYear();
    if (d.negotiate) return new Date(d.negotiate).getFullYear();
    return new Date().getFullYear();
  }

  async function generateCaseNo(dates){
    const targetYear = getTargetYear(dates);
    const counterRef = ref(db, `users/${currentUser.uid}/meta/counters/${targetYear}`);

    const snapshot = await get(counterRef);
    let currentCounter = snapshot.exists() ? snapshot.val() : 0;

    currentCounter += 1;
    await set(counterRef, currentCounter);

    const yearSuffix = String(targetYear).slice(-2);
    const sequence = String(currentCounter).padStart(4, '0');
    return `${yearSuffix}-${sequence}`;
  }

  function resetForm() {
    editingId = null;
    document.getElementById('addTitle').textContent = '新增案件';
    document.getElementById('btnAdd').textContent = '加入合作總覽';
    document.getElementById('btnCancelEdit').style.display = 'none';

    document.getElementById('inputBrand').value = '';
    document.getElementById('inputProduct').value = '';
    document.getElementById('inputFee').value = '';
    document.getElementById('inputDateContract').value = '';
    document.getElementById('inputDateDraft').value = '';
    document.getElementById('inputDateCollab').value = '';
    document.getElementById('inputDateCollabStart').value = '';
    document.getElementById('inputDateCollabEnd').value = '';
    document.getElementById('inputHasNonCompete').checked = false;
    document.getElementById('inputNonCompeteDate').value = '';
    document.getElementById('nonCompeteDateWrap').classList.remove('show');
    document.getElementById('inputAuthDate').value = '';
    document.getElementById('authDateWrap').classList.remove('show');
    document.querySelectorAll('#authToggles .auth-chip').forEach(b => b.classList.remove('selected'));
    document.getElementById('inputCommissionRate').value = '';
    document.getElementById('commissionRateWrap').classList.remove('show');
    document.getElementById('addErr').style.display = 'none';

    selectedPlatforms = [];
    selectedTypes = [];
    selectedModes = [];
    toggleCollabDateUI();
    document.querySelectorAll('#platToggles .plat-chip').forEach(b => b.classList.remove('selected'));
    document.querySelectorAll('#typeToggles .type-chip').forEach(b => b.classList.remove('selected'));
    document.querySelectorAll('#modeToggles .mode-chip').forEach(b => b.classList.remove('selected'));
  }

  function toggleCollabDateUI(){
    const isComm = selectedModes.includes('團購') || selectedModes.includes('分潤');
    document.getElementById('singleCollabDateWrap').style.display = isComm ? 'none' : 'block';
    document.getElementById('rangeCollabStartWrap').style.display = isComm ? 'block' : 'none';
    document.getElementById('rangeCollabEndWrap').style.display = isComm ? 'block' : 'none';
  }

  async function submitCase(){
    if(!currentUser) return;
    const brandEl = document.getElementById('inputBrand');
    const brand = brandEl.value.trim();
    const errEl = document.getElementById('addErr');

    if(!brand){
      errEl.textContent = '請至少輸入品牌名稱';
      errEl.style.display = 'block';
      brandEl.focus();
      return;
    }
    const hasNonCompete = document.getElementById('inputHasNonCompete').checked;
    const nonCompeteDate = document.getElementById('inputNonCompeteDate').value || null;
    if(hasNonCompete && !nonCompeteDate){
      errEl.textContent = '已勾選競業條款，請填寫競業截止日';
      errEl.style.display = 'block';
      document.getElementById('inputNonCompeteDate').focus();
      return;
    }
    const authTypes = Array.from(document.querySelectorAll('#authToggles .auth-chip.selected')).map(b => b.dataset.auth);
    const authDate = document.getElementById('inputAuthDate').value || null;
    if(authTypes.length && !authDate){
      errEl.textContent = '已選擇授權項目，請填寫授權截止日';
      errEl.style.display = 'block';
      document.getElementById('inputAuthDate').focus();
      return;
    }
    const modesPending = [...selectedModes];
    const needsRate = modesPending.includes('團購') || modesPending.includes('分潤');
    const commissionRateVal = document.getElementById('inputCommissionRate').value;
    if(needsRate && commissionRateVal === ''){
      errEl.textContent = '已選擇團購或分潤，請填寫％數';
      errEl.style.display = 'block';
      document.getElementById('inputCommissionRate').focus();
      return;
    }
    const commissionRate = commissionRateVal === '' ? null : Number(commissionRateVal);
    errEl.style.display = 'none';
    const platforms = selectedPlatforms.length ? [...selectedPlatforms] : ['其他'];
    const types = selectedTypes.length ? [...selectedTypes] : ['其他'];
    const modes = [...selectedModes];
    const product = document.getElementById('inputProduct').value.trim();
    const fee = Number(document.getElementById('inputFee').value) || 0;

    const dates = {
      contract: document.getElementById('inputDateContract').value || null,
      draft: document.getElementById('inputDateDraft').value || null,
      collab: !needsRate ? (document.getElementById('inputDateCollab').value || null) : null,
      collabStart: needsRate ? (document.getElementById('inputDateCollabStart').value || null) : null,
      collabEnd: needsRate ? (document.getElementById('inputDateCollabEnd').value || null) : null
    };

    if(editingId){
      await update(ref(db, `users/${currentUser.uid}/cases/` + editingId), {
        brand, platforms, types, modes, product, fee, dates, hasNonCompete, nonCompeteDate,
        authTypes, authDate, commissionRate
      });
    }else{
      const newId = uid();
      const caseNo = await generateCaseNo(dates);
      await set(ref(db, `users/${currentUser.uid}/cases/` + newId), {
        caseNo,
        brand, platforms, types, modes, product, fee, dates, hasNonCompete, nonCompeteDate,
        authTypes, authDate, commissionRate,
        salesAmount: null,
        stage: '製作中',
        createdAt: Date.now()
      });
    }

    resetForm();
  }

  function editCase(id){
    const c = cases.find(x => x.id === id);
    if(!c) return;

    editingId = c.id;
    document.getElementById('addTitle').textContent = '編輯案件 (' + (c.caseNo || '') + ')';
    document.getElementById('btnAdd').textContent = '儲存修改';
    document.getElementById('btnCancelEdit').style.display = 'inline-block';

    document.getElementById('inputBrand').value = c.brand || '';
    document.getElementById('inputProduct').value = c.product || '';
    document.getElementById('inputFee').value = c.fee || '';

    const d = c.dates || {};
    document.getElementById('inputDateContract').value = d.contract || '';
    document.getElementById('inputDateDraft').value = d.draft || '';
    document.getElementById('inputDateCollab').value = d.collab || '';
    document.getElementById('inputDateCollabStart').value = d.collabStart || '';
    document.getElementById('inputDateCollabEnd').value = d.collabEnd || '';

    document.getElementById('inputHasNonCompete').checked = !!c.hasNonCompete;
    document.getElementById('inputNonCompeteDate').value = c.nonCompeteDate || '';
    document.getElementById('nonCompeteDateWrap').classList.toggle('show', !!c.hasNonCompete);

    const auths = c.authTypes || [];
    document.querySelectorAll('#authToggles .auth-chip').forEach(b => {
      b.classList.toggle('selected', auths.includes(b.dataset.auth));
    });
    document.getElementById('inputAuthDate').value = c.authDate || '';
    document.getElementById('authDateWrap').classList.toggle('show', auths.length > 0);

    selectedTypes = [...(c.types || [])];
    document.querySelectorAll('#typeToggles .type-chip').forEach(b => {
      b.classList.toggle('selected', selectedTypes.includes(b.dataset.type));
    });

    selectedModes = [...(c.modes || [])];
    document.querySelectorAll('#modeToggles .mode-chip').forEach(b => {
      b.classList.toggle('selected', selectedModes.includes(b.dataset.mode));
    });

    toggleCollabDateUI();

    document.getElementById('inputCommissionRate').value = c.commissionRate != null ? c.commissionRate : '';
    const needsRate = selectedModes.includes('團購') || selectedModes.includes('分潤');
    document.getElementById('commissionRateWrap').classList.toggle('show', needsRate);

    selectedPlatforms = [...(c.platforms || [])];
    document.querySelectorAll('#platToggles .plat-chip').forEach(b => {
      b.classList.toggle('selected', selectedPlatforms.includes(b.dataset.plat));
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function updateStage(id, newStage){
    if(!currentUser) return;
    await update(ref(db, `users/${currentUser.uid}/cases/` + id), { stage: newStage });
  }

  async function updateSalesAmount(id, val){
    if(!currentUser) return;
    const salesAmount = val === '' ? null : Number(val);
    await update(ref(db, `users/${currentUser.uid}/cases/` + id), { salesAmount });
  }

  async function deleteCase(id){
    if(!currentUser) return;
    await remove(ref(db, `users/${currentUser.uid}/cases/` + id));
    if(editingId === id) resetForm();
  }

  window.editCase = editCase;
  window.updateStage = updateStage;
  window.updateSalesAmount = updateSalesAmount;
  window.deleteCase = deleteCase;

  function getEffectiveFee(c){
    let total = c.fee || 0;
    const isComm = c.modes && (c.modes.includes('團購') || c.modes.includes('分潤'));
    if(isComm && c.commissionRate != null && c.salesAmount != null){
      total += Math.round(c.salesAmount * (c.commissionRate / 100));
    }
    return total;
  }

  function isOverdue(c){
    const draft = c.dates && c.dates.draft;
    if(!draft || c.stage !== '製作中') return false;
    const today = new Date(); today.setHours(0,0,0,0);
    return new Date(draft) < today;
  }

  function fmtDue(due){
    if(!due) return '';
    const d = new Date(due);
    return (d.getMonth()+1) + '/' + d.getDate();
  }

  function fmtMoney(n){
    return 'NT$' + Math.round(n || 0).toLocaleString('zh-TW');
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function daysUntil(dateStr){
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(dateStr); target.setHours(0,0,0,0);
    return Math.round((target - today) / 86400000);
  }

  function renderDeadlineBanner(allCases){
    const upcoming = allCases
      .filter(c => {
        if(!c.dates || !c.dates.draft) return false;
        if(c.stage !== '製作中') return false;
        const days = daysUntil(c.dates.draft);
        return days >= 0 && days <= 7;
      })
      .map(c => ({ c, days: daysUntil(c.dates.draft) }))
      .sort((a,b) => a.days - b.days);

    const banner = document.getElementById('deadlineBanner');
    const list = document.getElementById('deadlineList');

    if(upcoming.length === 0){
      banner.classList.remove('show');
      list.innerHTML = '';
      return;
    }

    banner.classList.add('show');
    list.innerHTML = upcoming.map(({ c, days }) => {
      const label = days === 0 ? '今天截止' : days + ' 天後截止';
      return '<div class="deadline-item">'
        + '<span class="name">' + (c.caseNo ? c.caseNo + ' · ' : '') + escapeHtml(c.brand) + '</span>'
        + '<span class="days' + (days === 0 ? ' today' : '') + '">' + label + '</span>'
        + '</div>';
    }).join('');
  }

  function renderYearFilters(){
    const yearSet = new Set();
    cases.forEach(c => {
      const y = getTargetYear(c.dates);
      if(y) yearSet.add(y);
    });

    const sortedYears = Array.from(yearSet).sort((a,b) => b - a);
    const container = document.getElementById('yearFilters');

    let html = `<button class="tab ${currentYear === 'all' ? 'active' : ''}" data-year="all">全部年份</button>`;
    sortedYears.forEach(y => {
      html += `<button class="tab ${String(currentYear) === String(y) ? 'active' : ''}" data-year="${y}">${y} 年</button>`;
    });

    container.innerHTML = html;
  }

  function render(){
    renderDeadlineBanner(cases);

    const filtered = cases.filter(c => {
      const matchPlat = currentPlat === 'all' || (c.platforms && c.platforms.includes(currentPlat));
      const caseYear = String(getTargetYear(c.dates));
      const matchYear = currentYear === 'all' || caseYear === String(currentYear);
      return matchPlat && matchYear;
    });

    const active = filtered.filter(c => c.stage !== '已收款').length;
    const pending = filtered.filter(c => c.stage === '待請款').reduce((s,c) => s + getEffectiveFee(c), 0);
    const paid = filtered.filter(c => c.stage === '已收款').reduce((s,c) => s + getEffectiveFee(c), 0);

    document.getElementById('statActive').textContent = active;
    document.getElementById('statPending').textContent = fmtMoney(pending);
    document.getElementById('statPaid').textContent = fmtMoney(paid);

    const board = document.getElementById('board');
    board.innerHTML = STAGES.map((stage) => {
      const allItems = filtered.filter(c => c.stage === stage.key)
        .sort((a,b) => {
          const da = getSortDate(a);
          const db_ = getSortDate(b);
          if(da && db_) return new Date(da) - new Date(db_);
          if(da) return -1;
          if(db_) return 1;
          return b.createdAt - a.createdAt;
        });

      const isExpanded = expandedStages.has(stage.key);
      const items = isExpanded ? allItems : allItems.slice(0, 3);
      const hiddenCount = allItems.length - items.length;

      const notesHtml = allItems.length === 0
        ? '<div class="empty-col">尚無案件</div>'
        : items.map((c, i) => {
            const overdue = isOverdue(c);
            const noteClass = 'n' + (i % 4);
            const optionsHtml = STAGES.map(s =>
              '<option value="' + s.key + '"' + (s.key === c.stage ? ' selected' : '') + '>' + s.key + '</option>'
            ).join('');

            const d = c.dates || {};
            let collabStr = null;
            if(d.collabStart || d.collabEnd){
              collabStr = '合 ' + (d.collabStart ? fmtDue(d.collabStart) : '未定') + '-' + (d.collabEnd ? fmtDue(d.collabEnd) : '未定');
            } else if(d.collab){
              collabStr = '合 ' + fmtDue(d.collab);
            }

            const dateChips = [
              d.contract ? '簽 ' + fmtDue(d.contract) : null,
              d.draft ? '稿 ' + fmtDue(d.draft) : null,
              collabStr
            ].filter(Boolean).join(' ');

            const isComm = c.modes && (c.modes.includes('團購') || c.modes.includes('分潤'));
            const showSalesInput = isComm && (c.stage === '待請款' || c.stage === '已收款');
            const effectiveFee = getEffectiveFee(c);

            let deadlineBadgeHtml = '';
            if(d.draft && c.stage === '製作中'){
              const daysLeft = daysUntil(d.draft);
              if(daysLeft >= 0 && daysLeft <= 7){
                const label = daysLeft === 0 ? '今天截止' : daysLeft + ' 天後截止';
                deadlineBadgeHtml = '<span class="note-deadline-badge' + (daysLeft === 0 ? ' today' : '') + '">⏰ ' + label + '</span><br>';
              }
            }

            let salesInputHtml = '';
            if(showSalesInput){
              salesInputHtml = '<div class="sales-input-wrap">'
                + '<label>總銷售金額 (分潤 ' + (c.commissionRate || 0) + '%)</label>'
                + '<input type="number" placeholder="請輸入銷售總額" value="' + (c.salesAmount != null ? c.salesAmount : '') + '" onchange="updateSalesAmount(\'' + c.id + '\', this.value)">'
                + '</div>';
            }

            return '<div class="note ' + noteClass + '" onclick="if(!event.target.closest(\'select, button, input\')) editCase(\'' + c.id + '\')">'
              + (c.caseNo ? '<p class="note-no">' + c.caseNo + '</p>' : '')
              + deadlineBadgeHtml
              + '<p class="note-brand">' + escapeHtml(c.brand) + '</p>'
              + (c.product ? '<p class="note-product">' + escapeHtml(c.product) + '</p>' : '')
              + '<p class="note-type">' + (c.platforms||[]).join('／') + ' · ' + (c.types||[]).join('／') + '</p>'
              + (c.modes && c.modes.length ? '<p class="note-type">' + c.modes.join('／') + (c.commissionRate != null ? '（' + c.commissionRate + '%）' : '') + '</p>' : '')
              + salesInputHtml
              + '<div class="note-row">'
              + '<span class="note-fee">' + fmtMoney(effectiveFee) + (isComm && c.salesAmount != null ? ' <small style="font-weight:normal;opacity:0.8;">(含分潤)</small>' : '') + '</span>'
              + (overdue ? '<span class="note-due overdue">逾期</span>' : '<span></span>')
              + '</div>'
              + (dateChips ? '<div class="note-dates">' + dateChips + '</div>' : '')
              + (c.hasNonCompete ? '<div class="note-dates">競業至 ' + fmtDue(c.nonCompeteDate) + '</div>' : '')
              + (c.authTypes && c.authTypes.length ? '<div class="note-dates">' + c.authTypes.join('／') + '授權至 ' + fmtDue(c.authDate) + '</div>' : '')
              + '<div class="note-actions">'
              + '<select onchange="updateStage(\'' + c.id + '\', this.value)">' + optionsHtml + '</select>'
              + '<button class="note-del" onclick="deleteCase(\'' + c.id + '\')" aria-label="刪除">✕</button>'
              + '</div>'
              + '</div>';
          }).join('');

      const moreBtnHtml = hiddenCount > 0
        ? '<button class="col-more-btn" onclick="toggleStageExpand(\'' + stage.key + '\')">看更多（還有 ' + hiddenCount + ' 筆）</button>'
        : (isExpanded && allItems.length > 3
            ? '<button class="col-more-btn" onclick="toggleStageExpand(\'' + stage.key + '\')">收合</button>'
            : '');

      return '<div class="col">'
        + '<div class="col-head">'
        + '<span class="col-dot" style="background:' + stage.dot + '"></span>'
        + '<h3>' + stage.key + '</h3>'
        + '<span class="col-count">' + allItems.length + '</span>'
        + '</div>'
        + notesHtml
        + moreBtnHtml
        + '</div>';
    }).join('');
  }

  function toggleStageExpand(stageKey){
    if(expandedStages.has(stageKey)){
      expandedStages.delete(stageKey);
    }else{
      expandedStages.add(stageKey);
    }
    render();
  }
  window.toggleStageExpand = toggleStageExpand;

  document.getElementById('inputHasNonCompete').addEventListener('change', e => {
    document.getElementById('nonCompeteDateWrap').classList.toggle('show', e.target.checked);
    if(!e.target.checked){
      document.getElementById('inputNonCompeteDate').value = '';
      document.getElementById('addErr').style.display = 'none';
    }
  });

  document.getElementById('authToggles').addEventListener('click', e => {
    const chip = e.target.closest('.auth-chip');
    if(!chip) return;
    chip.classList.toggle('selected');
    const anySelected = document.querySelectorAll('#authToggles .auth-chip.selected').length > 0;
    document.getElementById('authDateWrap').classList.toggle('show', anySelected);
    if(!anySelected){
      document.getElementById('inputAuthDate').value = '';
      document.getElementById('addErr').style.display = 'none';
    }
  });

  document.getElementById('btnAdd').addEventListener('click', submitCase);
  document.getElementById('btnCancelEdit').addEventListener('click', resetForm);

  document.getElementById('inputBrand').addEventListener('keydown', e => { if(e.key === 'Enter') submitCase(); });
  document.getElementById('inputBrand').addEventListener('input', () => {
    document.getElementById('addErr').style.display = 'none';
  });

  document.getElementById('typeToggles').addEventListener('click', e => {
    const chip = e.target.closest('.type-chip');
    if(!chip) return;
    const type = chip.dataset.type;
    if(selectedTypes.includes(type)){
      selectedTypes = selectedTypes.filter(t => t !== type);
      chip.classList.remove('selected');
    }else{
      selectedTypes.push(type);
      chip.classList.add('selected');
    }
  });

  document.getElementById('modeToggles').addEventListener('click', e => {
    const chip = e.target.closest('.mode-chip');
    if(!chip) return;
    const mode = chip.dataset.mode;
    if(selectedModes.includes(mode)){
      selectedModes = selectedModes.filter(m => m !== mode);
      chip.classList.remove('selected');
    }else{
      selectedModes.push(mode);
      chip.classList.add('selected');
    }
    const needsRate = selectedModes.includes('團購') || selectedModes.includes('分潤');
    document.getElementById('commissionRateWrap').classList.toggle('show', needsRate);
    if(!needsRate){
      document.getElementById('inputCommissionRate').value = '';
      document.getElementById('addErr').style.display = 'none';
    }
    toggleCollabDateUI();
  });

  document.getElementById('platToggles').addEventListener('click', e => {
    const chip = e.target.closest('.plat-chip');
    if(!chip) return;
    const plat = chip.dataset.plat;
    if(selectedPlatforms.includes(plat)){
      selectedPlatforms = selectedPlatforms.filter(p => p !== plat);
      chip.classList.remove('selected');
    }else{
      selectedPlatforms.push(plat);
      chip.classList.add('selected');
    }
  });

  document.getElementById('yearFilters').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if(!btn) return;
    document.querySelectorAll('#yearFilters .tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentYear = btn.dataset.year;
    render();
  });

  document.getElementById('platformFilters').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if(!btn) return;
    document.querySelectorAll('#platformFilters .tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPlat = btn.dataset.plat;
    render();
  });

  // 頁面持續開啟時，每 60 秒再檢查一次日期。
  // 這樣跨過午夜後，也能自動把符合條件的「待審核」案件移到「待請款」。
  setInterval(() => {
    autoMoveApprovedCasesToPending();
  }, 60000);

  // ---------- Excel 匯出功能 ----------
  document.getElementById('btnExportExcel').addEventListener('click', () => {
    if (!cases || cases.length === 0) {
      alert('目前沒有資料可供匯出');
      return;
    }

    const excelData = cases.map(c => {
      const d = c.dates || {};
      return {
        '案件編號': c.caseNo || '',
        '階段': c.stage || '',
        '品牌': c.brand || '',
        '產品': c.product || '',
        '保底金額': c.fee || 0,
        '合作平台': (c.platforms || []).join(', '),
        '合作項目': (c.types || []).join(', '),
        '合作模式': (c.modes || []).join(', '),
        '分潤/團購比例(%)': c.commissionRate ?? '',
        '總銷售金額': c.salesAmount ?? '',
        '簽約日期': d.contract || '',
        '初稿截止日': d.draft || '',
        '合作日期': d.collab || '',
        '合作開始日': d.collabStart || '',
        '合作結束日': d.collabEnd || '',
        '是否有競業條款': c.hasNonCompete ? '是' : '否',
        '競業截止日': c.nonCompeteDate || '',
        '授權類型': (c.authTypes || []).join(', '),
        '授權截止日': c.authDate || ''
      };
    });

    const worksheet = XLSX.utils.json_to_sheet(excelData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, '合作案件');

    const today = new Date().toISOString().split('T')[0];
    XLSX.writeFile(workbook, `合作案件總覽_${today}.xlsx`);
  });

  // ---------- Excel 匯入功能 ----------
  document.getElementById('btnImportExcel').addEventListener('click', () => {
    document.getElementById('fileImportExcel').click();
  });

  document.getElementById('fileImportExcel').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !currentUser) return;

    const reader = new FileReader();
    reader.onload = async (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const rows = XLSX.utils.sheet_to_json(worksheet);

        if (rows.length === 0) {
          alert('匯入的檔案無資料！');
          return;
        }

        let importCount = 0;
        const maxCountersByYear = {};

        for (const row of rows) {
          const brand = row['品牌'] ? String(row['品牌']).trim() : '';
          if (!brand) continue;

          const dates = {
            contract: row['簽約日期'] || null,
            draft: row['初稿截止日'] || null,
            collab: row['合作日期'] || null,
            collabStart: row['合作開始日'] || null,
            collabEnd: row['合作結束日'] || null
          };

          const targetYear = getTargetYear(dates);
          let caseNo = row['案件編號'] ? String(row['案件編號']).trim() : '';

          if (caseNo) {
            const parts = caseNo.split('-');
            if (parts.length === 2) {
              const seq = parseInt(parts[1], 10);
              if (!isNaN(seq)) {
                if (!maxCountersByYear[targetYear] || seq > maxCountersByYear[targetYear]) {
                  maxCountersByYear[targetYear] = seq;
                }
              }
            }
          } else {
            const yearCounterRef = ref(db, `users/${currentUser.uid}/meta/counters/${targetYear}`);
            const currentMax = maxCountersByYear[targetYear];

            if (currentMax === undefined) {
              const snapshot = await get(yearCounterRef);
              maxCountersByYear[targetYear] = snapshot.exists() ? snapshot.val() : 0;
            }

            maxCountersByYear[targetYear] += 1;

            const yearSuffix = String(targetYear).slice(-2);
            const sequence = String(maxCountersByYear[targetYear]).padStart(4, '0');
            caseNo = `${yearSuffix}-${sequence}`;
          }

          const newId = uid();
          const newCase = {
            caseNo,
            brand,
            product: row['產品'] || '',
            fee: Number(row['保底金額']) || 0,
            platforms: row['合作平台'] ? String(row['合作平台']).split(',').map(s => s.trim()) : ['其他'],
            types: row['合作項目'] ? String(row['合作項目']).split(',').map(s => s.trim()) : ['其他'],
            modes: row['合作模式'] ? String(row['合作模式']).split(',').map(s => s.trim()) : [],
            commissionRate: row['分潤/團購比例(%)'] !== undefined && row['分潤/團購比例(%)'] !== '' ? Number(row['分潤/團購比例(%)']) : null,
            salesAmount: row['總銷售金額'] !== undefined && row['總銷售金額'] !== '' ? Number(row['總銷售金額']) : null,
            dates,
            hasNonCompete: row['是否有競業條款'] === '是',
            nonCompeteDate: row['競業截止日'] || null,
            authTypes: row['授權類型'] ? String(row['授權類型']).split(',').map(s => s.trim()) : [],
            authDate: row['授權截止日'] || null,
            stage: row['階段'] || '製作中',
            createdAt: Date.now()
          };

          await set(ref(db, `users/${currentUser.uid}/cases/${newId}`), newCase);
          importCount++;
        }

        for (const [yr, maxSeq] of Object.entries(maxCountersByYear)) {
          const counterRef = ref(db, `users/${currentUser.uid}/meta/counters/${yr}`);
          const snapshot = await get(counterRef);
          const currentInDb = snapshot.exists() ? snapshot.val() : 0;
          if (maxSeq > currentInDb) {
            await set(counterRef, maxSeq);
          }
        }

        alert(`成功匯入 ${importCount} 筆案件！編號已自動銜接更新。`);
        e.target.value = '';
      } catch (err) {
        console.error('匯入失敗：', err);
        alert('檔案解析失敗，請確認檔案格式是否正確。');
      }
    };

    reader.readAsArrayBuffer(file);
  });
</script>
</body>
</html>
